<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music — Ray Gaule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/music.css">
</head>
<body class="music-page">

<!-- ══════════════════════════════════════
     NAV
══════════════════════════════════════ -->
<nav class="nav" role="navigation">
  <div class="container nav__inner">
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg>
      Ray Gaule
    </a>
    <span style="font-size:.8rem; color:var(--text-tertiary); pointer-events:none;">
      Music Taste
    </span>
  </div>
</nav>

<!-- ══════════════════════════════════════
     HERO
══════════════════════════════════════ -->
<header class="music-hero">
  <div class="container">
    <div class="music-hero__eyebrow">What I Listen To</div>
    <h1 class="music-hero__title">Sound &amp; Feeling</h1>
    <p class="music-hero__sub">
      不同的专辑，进入不同状态的方式。
    </p>

    <div class="wave-divider" aria-hidden="true"
         style="opacity:.28; margin-top:2rem; justify-content:center;">
      <div class="wave-divider__bar"></div>
      <div class="wave-divider__bar"></div>
      <div class="wave-divider__bar"></div>
      <div class="wave-divider__bar"></div>
      <div class="wave-divider__bar"></div>
      <div class="wave-divider__bar"></div>
      <div class="wave-divider__bar"></div>
      <div class="wave-divider__bar"></div>
      <div class="wave-divider__bar"></div>
    </div>
  </div>
</header>

<!-- ══════════════════════════════════════
     INFINITE CAROUSEL
══════════════════════════════════════ -->
<section class="carousel-section">
  <!-- Full-bleed viewport -->
  <div class="carousel-viewport">
    <div class="carousel-track" id="carouselTrack">
      <!-- 24 cards (12×2) injected by music.js -->
    </div>
  </div>

  <div class="carousel-hint" aria-hidden="true">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M18 8L22 12L18 16M6 16L2 12L6 8"/>
    </svg>
    Hover to show · Click to play
  </div>
</section>

<!-- ══════════════════════════════════════
     FULL ALBUM GRID
══════════════════════════════════════ -->
<section class="album-grid-section">
  <div class="container">
    <div class="section-header reveal">
      <div class="section-eyebrow">Full List</div>
      <h2 class="section-title">All 12 Albums</h2>
    </div>
    <div class="album-grid" id="albumGrid">
      <!-- Filled by music.js -->
    </div>
  </div>
</section>

<!-- ══════════════════════════════════════
     FOOTER
══════════════════════════════════════ -->
<footer class="footer">
  <div class="container">
    <a href="index.html" class="back-link" style="font-size:.8rem;">
      <svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg>
      Back to Home
    </a>
  </div>
</footer>

<!-- ══════════════════════════════════════
     MINI PLAYER
══════════════════════════════════════ -->
<div id="player" class="player" aria-label="音乐播放器"></div>

<script src="js/player.js"></script>
<script src="js/music.js"></script>
</body>
</html>
